<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Links | Streamer Mode</title>
    <style>
        :root {
            --primary-color: #9146ff; /* Roxo Twitch */
            --bg-color: #0e0e10;
            --card-bg: #1f1f23;
            --text-color: #efeff1;
            --hover-color: #bf94ff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            margin: 0;
        }

        .profile-pic {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            border: 3px solid var(--primary-color);
            box-shadow: 0 0 15px var(--primary-color);
            margin-bottom: 15px;
        }

        h1 { font-size: 1.5rem; margin-bottom: 5px; }
        p { color: #adadb8; margin-bottom: 30px; font-size: 0.9rem; }

        .links-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-card {
            background-color: var(--card-bg);
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            text-decoration: none;
            color: var(--text-color);
            font-weight: bold;
            border: 1px solid transparent;
            transition: all 0.3s ease;
        }

        .link-card:hover {
            border-color: var(--primary-color);
            transform: scale(1.02);
            background-color: #26262c;
            box-shadow: 0 0 10px rgba(145, 70, 255, 0.3);
        }

        /* Cores específicas para cada rede */
        .instagram:hover { border-color: #e1306c; box-shadow: 0 0 10px #e1306c55; }
        .discord:hover { border-color: #5865f2; box-shadow: 0 0 10px #5865f255; }
        .twitch:hover { border-color: #9146ff; box-shadow: 0 0 10px #9146ff55; }
    </style>
</head>
<body>

    <img src="https://via.placeholder.com/100"" class="profile-pic">

    <h1>@Luiz</h1>
    <p>Streamer Redes Sociais</p>

    <div class="links-container">
       <a href="https://www.twitch.tv/luixz0101" target="_blank" class="link-card discord">TWITCH</a>
        <a href="https://discord.gg/zxdpQ2cU" target="_blank" class="link-card discord">DISCORD</a>
        <a href="https://www.instagram.com/zinholdskk/" target="_blank" class="link-card instagram">INSTAGRAM</a>
        <a href="https://www.youtube.com/@Luizofc001" target="_blank" class="link-card">YOUTUBE</a>
       <a href="https://livepix.gg/luixz00" target="_blank" class="link-card">DONATES</a>
    </div>

</body>
</html>
